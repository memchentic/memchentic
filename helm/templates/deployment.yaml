apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "memchentic.fullname" . }}
  labels:
    {{- include "memchentic.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "memchentic.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if eq (include "memchentic.secretsMode" .) "inline" }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "memchentic.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "memchentic.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.migrations.initContainer.enabled }}
      initContainers:
        - name: migrate
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "memchentic.migrate"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          envFrom:
            - configMapRef:
                name: {{ include "memchentic.fullname" . }}-config
            - secretRef:
                name: {{ include "memchentic.secretName" . }}
          env:
            - name: POSTGRES_HOSTNAME
              value: {{ include "memchentic.postgresHostname" . | quote }}
            - name: POSTGRES_PORT
              value: {{ ternary .Values.postgres.service.port .Values.config.postgresPort .Values.postgres.enabled | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.config.postgresUser | quote }}
            - name: POSTGRES_APP_USER
              value: {{ .Values.config.postgresAppUser | default "memchentic_app" | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.config.postgresDb | quote }}
      {{- end }}
      containers:
        - name: application
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          envFrom:
            - configMapRef:
                name: {{ include "memchentic.fullname" . }}-config
            - secretRef:
                name: {{ include "memchentic.secretName" . }}
          env:
            - name: POSTGRES_HOSTNAME
              value: {{ include "memchentic.postgresHostname" . | quote }}
            - name: POSTGRES_PORT
              value: {{ ternary .Values.postgres.service.port .Values.config.postgresPort .Values.postgres.enabled | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.config.postgresUser | quote }}
            - name: POSTGRES_APP_USER
              value: {{ .Values.config.postgresAppUser | default "memchentic_app" | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.config.postgresDb | quote }}
            {{- if .Values.migrations.initContainer.enabled }}
            - name: RUN_MIGRATIONS_ON_BOOT
              value: "false"
            - name: POSTGRES_PASSWORD
              value: ""
            {{- end }}
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath | quote }}
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
