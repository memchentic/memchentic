{{- include "memchentic.validateSecrets" . }}
{{- if eq (.Values.secrets.mode | default "inline") "externalSecret" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "memchentic.fullname" . }}-env
  labels:
    {{- include "memchentic.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.secrets.externalSecret.secretStoreRef.name | quote }}
    kind: {{ .Values.secrets.externalSecret.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ include "memchentic.fullname" . }}-env
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range $secretKey, $ref := .Values.secrets.externalSecret.data }}
    - secretKey: {{ $secretKey }}
      remoteRef:
        key: {{ $ref.key | quote }}
        {{- if $ref.property }}
        property: {{ $ref.property | quote }}
        {{- end }}
    {{- end }}
{{- end }}
