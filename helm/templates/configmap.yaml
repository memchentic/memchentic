apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "memchentic.fullname" . }}-config
  labels:
    {{- include "memchentic.labels" . | nindent 4 }}
data:
  BASE_URL: {{ .Values.config.baseUrl | quote }}
  OAUTH_PROVIDER: {{ .Values.config.oauthProvider | quote }}
  OAUTH_CLIENT_ID: {{ .Values.config.oauthClientId | quote }}
  OAUTH_ISSUER: {{ .Values.config.oauthIssuer | quote }}
  OAUTH_AUDIENCE: {{ .Values.config.oauthAudience | quote }}
  OAUTH_JWKS_URI: {{ .Values.config.oauthJwksUri | quote }}
  OAUTH_SCOPES: {{ .Values.config.oauthScopes | quote }}
  OAUTH_NATIVE_REDIRECT_SCHEMES: {{ .Values.config.oauthNativeRedirectSchemes | quote }}
  ADMIN_EMAIL: {{ .Values.config.adminEmail | quote }}
  ADMIN_DISPLAY_NAME: {{ .Values.config.adminDisplayName | quote }}
  NEAR_DUP_THRESHOLD: {{ .Values.config.nearDupThreshold | quote }}
  RRF_K: {{ .Values.config.rrfK | quote }}
  SEARCH_DEFAULT_LIMIT: {{ .Values.config.searchDefaultLimit | quote }}
  BROWSE_DEFAULT_LIMIT: {{ .Values.config.browseDefaultLimit | quote }}
  RESULT_MAX_LIMIT: {{ .Values.config.resultMaxLimit | quote }}
  SEARCH_RECENCY_HALF_LIFE_DAYS: {{ .Values.config.searchRecencyHalfLifeDays | quote }}
  SEARCH_RECENCY_WEIGHT: {{ .Values.config.searchRecencyWeight | quote }}
  SEARCH_PATH_BOOST: {{ .Values.config.searchPathBoost | quote }}
  SEARCH_MIN_SIMILARITY: {{ .Values.config.searchMinSimilarity | quote }}
  NEAR_DUP_CANDIDATES: {{ .Values.config.nearDupCandidates | quote }}
  OVERLAP_SCAN_LIMIT: {{ .Values.config.overlapScanLimit | quote }}
  MEMORY_USAGE_SCORE_WEIGHT: {{ .Values.config.memoryUsageScoreWeight | quote }}
  MEMORY_DEFAULT_TTL_DAYS: {{ .Values.config.memoryDefaultTtlDays | quote }}
  MEMORY_TTL_EXTEND_DAYS: {{ .Values.config.memoryTtlExtendDays | quote }}
  MEMORY_TTL_TOUCH_DEBOUNCE_HOURS: {{ .Values.config.memoryTtlTouchDebounceHours | quote }}
  MEMORY_MAX_TTL_DAYS: {{ .Values.config.memoryMaxTtlDays | quote }}
  MEMORY_LLM_PROVIDER: {{ .Values.config.memoryLlmProvider | default "openai" | quote }}
  MEMORY_LLM_BASE_URL: {{ .Values.config.memoryLlmBaseUrl | default "" | quote }}
  MEMORY_LLM_MODEL: {{ .Values.config.memoryLlmModel | default "gpt-4o-mini" | quote }}
  MEMORY_DECISION_BASE_URL: {{ .Values.config.memoryDecisionBaseUrl | default "" | quote }}
  MEMORY_DECISION_MODEL: {{ .Values.config.memoryDecisionModel | default "kev-latest" | quote }}
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  SESSION_REMEMBER_DAYS: {{ .Values.config.sessionRememberDays | quote }}
  SESSION_BROWSER_HOURS: {{ .Values.config.sessionBrowserHours | quote }}
  {{- if not (kindIs "invalid" .Values.config.sessionCookieSecure) }}
  {{- with (toString .Values.config.sessionCookieSecure) }}
  SESSION_COOKIE_SECURE: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.config.forwardedAllowIps }}
  FORWARDED_ALLOW_IPS: {{ .Values.config.forwardedAllowIps | quote }}
  {{- end }}
  REGISTER_ENABLED: {{ .Values.config.registerEnabled | quote }}
  SMTP_HOST: {{ .Values.config.smtpHost | default "" | quote }}
  SMTP_PORT: {{ .Values.config.smtpPort | default "587" | quote }}
  SMTP_USERNAME: {{ .Values.config.smtpUsername | default "" | quote }}
  SMTP_FROM: {{ .Values.config.smtpFrom | default "" | quote }}
  SMTP_USE_TLS: {{ .Values.config.smtpUseTls | default "true" | quote }}
  ENABLE_API_DOCS: {{ .Values.config.enableApiDocs | default "false" | quote }}
  POSTGRES_SSLMODE: {{ .Values.config.postgresSslmode | quote }}
  POSTGRES_SSLROOTCERT: {{ .Values.config.postgresSslrootcert | quote }}
  DB_POOL_SIZE: {{ .Values.config.dbPoolSize | default "5" | quote }}
  DB_MAX_OVERFLOW: {{ .Values.config.dbMaxOverflow | default "10" | quote }}
  DB_POOL_TIMEOUT: {{ .Values.config.dbPoolTimeout | default "30" | quote }}
