# Default values for memchentic.
# Override with -f / --set. Homelab site overrides live outside this repo.
# Secrets: use existing or externalSecret — inline values are empty placeholders only.

# Default one replica. Multi-replica is supported: auth rate limits, bootstrap
# and hygiene automation coordinate through Postgres. Size the DB pool with
# config.dbPoolSize / dbMaxOverflow so
#   replicas × (pool_size + max_overflow + 1 LISTEN) < postgres max_connections
# with headroom. Prefer migrations.initContainer.enabled=true when replicaCount > 1
# (see helm/examples/scaled.yaml). Extensions and schema migrations still use a
# Postgres advisory lock across rolling updates.
replicaCount: 1

image:
  repository: registry.memchentic.ai/memchentic/memchentic
  # Empty → Chart.appVersion (pinned). Do not use latest in production.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Create a ServiceAccount named after the release (or `name`).
  create: false
  name: ""
  annotations: {}
  # The application never calls the Kubernetes API. Set true only when a
  # workload-identity integration needs the default token mount.
  automount: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: memchentic.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

probes:
  # `/api/ready` checks the database and the embedder before the pod takes traffic.
  readinessPath: /api/ready

nodeSelector: {}
tolerations: []
affinity: {}

# Extra volumes and mounts for the application pod. Use them to provide files
# that a config value points at, for example the CA bundle for
# config.postgresSslrootcert:
#   extraVolumes:
#     - name: db-ca
#       configMap:
#         name: db-ca
#   extraVolumeMounts:
#     - name: db-ca
#       mountPath: /etc/memchentic/ca
#       readOnly: true
#   config:
#     postgresSslmode: verify-full
#     postgresSslrootcert: /etc/memchentic/ca/ca.crt
extraVolumes: []
extraVolumeMounts: []

# Non-secret application settings (ConfigMap → env).
config:
  # Must be the public https origin in real deployments.
  baseUrl: ""
  oauthProvider: internal
  oauthClientId: ""
  oauthIssuer: ""
  oauthAudience: ""
  oauthJwksUri: ""
  # Comma-separated. Blank = the provider preset's default scopes.
  oauthScopes: ""
  # Private-use redirect schemes native MCP clients may register (comma-separated).
  oauthNativeRedirectSchemes: cursor
  adminEmail: admin@example.com
  adminDisplayName: Admin
  postgresUser: memchentic
  postgresAppUser: memchentic_app
  postgresDb: memchentic
  postgresPort: 5432
  # Used when postgres.enabled=false (external database hostname).
  postgresHostname: ""
  # disable | prefer | require | verify-ca | verify-full. Use verify-full for any
  # database reached over a network you do not own (e.g. CNPG, managed Postgres).
  postgresSslmode: prefer
  # CA bundle path inside the pod; empty = system CAs.
  postgresSslrootcert: ""
  # Per-process SQLAlchemy pool (see replicaCount comment above).
  dbPoolSize: "5"
  dbMaxOverflow: "10"
  dbPoolTimeout: "30"
  nearDupThreshold: "0.92"
  rrfK: "60"
  searchDefaultLimit: "20"
  browseDefaultLimit: "50"
  resultMaxLimit: "100"
  searchRecencyHalfLifeDays: "30"
  searchRecencyWeight: "0.25"
  searchPathBoost: "0.15"
  searchMinSimilarity: "0.2"
  nearDupCandidates: "5"
  overlapScanLimit: "2000"
  memoryUsageScoreWeight: "0.05"
  # Sliding TTL; "0" disables the default lifetime / the max ceiling.
  memoryDefaultTtlDays: "90"
  memoryTtlExtendDays: "90"
  memoryTtlTouchDebounceHours: "6"
  memoryMaxTtlDays: "730"
  # Optional ingest LLM (use_llm). openai | anthropic | google.
  memoryLlmProvider: "openai"
  # OpenAI-compatible base (required for provider openai; OpenRouter example:
  # https://openrouter.ai/api/v1). Empty disables openai path.
  memoryLlmBaseUrl: ""
  memoryLlmModel: "gpt-4o-mini"
  # Optional System One decision gate (Jev / Kev). Empty base disables.
  memoryDecisionBaseUrl: ""
  memoryDecisionModel: "kev-latest"
  corsOrigins: ""
  logLevel: INFO
  sessionRememberDays: "30"
  sessionBrowserHours: "12"
  # Default Secure cookies for non-loopback hosts.
  sessionCookieSecure: "true"
  # Addresses or CIDR ranges of the ingress controller / reverse proxy that
  # may set X-Forwarded-For and X-Forwarded-Proto (comma separated), e.g. the
  # pod CIDR of the ingress controller. Empty = trust only 127.0.0.1 (uvicorn
  # default), which makes every client share one rate-limit bucket.
  forwardedAllowIps: ""
  # Public self-registration when OAUTH_PROVIDER=internal. With an external
  # provider it gates first-time sign-in instead. A person in an IdP group that
  # an auth group is bound to is always admitted. When the Users auth group is
  # bound, nobody else is admitted and this value is ignored.
  # First-boot value only; afterwards System Settings is the source of truth.
  registerEnabled: "true"
  # Outbound mail (SMTP). Empty smtpHost or smtpFrom disables email.
  # First-boot values only; afterwards System Settings → Mail.
  smtpHost: ""
  smtpPort: "587"
  smtpUsername: ""
  smtpFrom: ""
  smtpUseTls: "true"
  enableApiDocs: "false"

# Secret modes (exactly one):
#   existing        — use secrets.existingSecret (pre-synced by any tool) [preferred]
#   externalSecret  — chart renders ExternalSecret (Vault / AWS SM / 1Password via ESO)
#   inline          — chart renders a Secret from secrets.inline (dev only; no defaults)
secrets:
  mode: existing
  existingSecret: ""
  inline:
    ADMIN_PASSWORD: ""
    ADMIN_API_KEY: ""
    POSTGRES_PASSWORD: ""
    POSTGRES_APP_PASSWORD: ""
    # 32+ chars; encrypts signing keys stored in Postgres. Losing it invalidates them.
    ENCRYPTION_KEY: ""
    OAUTH_CLIENT_SECRET: ""
    # Optional; first-boot SMTP password (afterwards System Settings → Mail).
    SMTP_PASSWORD: ""
    # Optional; required for MEMORY_LLM_PROVIDER=anthropic|google (and most openai hosts).
    MEMORY_LLM_API_KEY: ""
    # Optional; Bearer for System One (Jev / Kev) when the server requires auth.
    MEMORY_DECISION_API_KEY: ""
  externalSecret:
    refreshInterval: 1h
    secretStoreRef:
      name: ""
      kind: ClusterSecretStore
    # Each key → provider remoteRef. Property semantics depend on the backend.
    data:
      ADMIN_PASSWORD:
        key: ""
        property: ADMIN_PASSWORD
      ADMIN_API_KEY:
        key: ""
        property: ADMIN_API_KEY
      POSTGRES_PASSWORD:
        key: ""
        property: POSTGRES_PASSWORD
      POSTGRES_APP_PASSWORD:
        key: ""
        property: POSTGRES_APP_PASSWORD
      ENCRYPTION_KEY:
        key: ""
        property: ENCRYPTION_KEY
      OAUTH_CLIENT_SECRET:
        key: ""
        property: OAUTH_CLIENT_SECRET
      SMTP_PASSWORD:
        key: ""
        property: SMTP_PASSWORD
      MEMORY_LLM_API_KEY:
        key: ""
        property: MEMORY_LLM_API_KEY
      MEMORY_DECISION_API_KEY:
        key: ""
        property: MEMORY_DECISION_API_KEY

# Schema migrations. Default: the application applies them on boot and so holds
# the owner-role password (POSTGRES_PASSWORD) for its whole lifetime.
# initContainer.enabled=true runs `python -m memchentic.migrate` in an init
# container and starts the application with RUN_MIGRATIONS_ON_BOOT=false and an
# empty POSTGRES_PASSWORD.
migrations:
  initContainer:
    enabled: false

postgres:
  enabled: true
  image:
    repository: pgvector/pgvector
    tag: 0.8.7-pg16
    pullPolicy: IfNotPresent
  service:
    port: 5432
  persistence:
    enabled: true
    storageClass: ""
    size: 10Gi
  resources: {}
  # uid/gid 999 is the `postgres` user of the Debian-based pgvector image.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  networkPolicy:
    # Allow ingress to the bundled Postgres only from the application pods.
    # It takes effect only when the cluster network plugin enforces NetworkPolicy.
    enabled: true
    # Extra NetworkPolicyPeer entries, e.g. the podSelector of a backup job.
    extraFrom: []
