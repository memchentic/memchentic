# Optional Sphinx docs overlay. Not listed in .env.example.
# Live sticky .env example:
#   COMPOSE_FILE=docker-compose.yaml:local.yaml:docs.yaml
#   DOCS_PORT=18099
#   DOCS_IMAGE=registry.memchentic.ai/memchentic/docs:latest
#
# Pull published image (default). `--build docs` needs a clone of
# https://github.com/memchentic/docs in ../docs, because docs/docker/Dockerfile
# is not tracked in this repository:
#   cd docker && docker compose up -d --build docs

services:
  docs:
    image: ${DOCS_IMAGE:-registry.memchentic.ai/memchentic/docs:latest}
    build:
      context: ../docs
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "${DOCS_PORT:-18099}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
