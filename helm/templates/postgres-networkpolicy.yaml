{{- if and .Values.postgres.enabled .Values.postgres.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "memchentic.fullname" . }}-postgres
  labels:
    {{- include "memchentic.postgres.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "memchentic.postgres.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "memchentic.selectorLabels" . | nindent 14 }}
        {{- with .Values.postgres.networkPolicy.extraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
