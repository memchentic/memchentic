name: memchentic

# Production-shaped stack: images and named volumes only (no source bind mounts).
# Local bind mounts + Vite GUI live in local.yaml (see COMPOSE_FILE in .env).

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: memchentic
      POSTGRES_PASSWORD: memchentic
      POSTGRES_DB: memchentic
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memchentic -d memchentic"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${MEMCHENTIC_API_PORT:-18080}:8080"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://memchentic:memchentic@db:5432/memchentic
      EMBEDDING_MODEL_PATH: /opt/memchentic/models/all-MiniLM-L6-v2
    working_dir: /opt/memchentic
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  db-data:
