# Default values for memchentic.
# Override with -f / --set. Homelab site overrides live outside this repo.
# Secrets: use existing or externalSecret — inline values are empty placeholders only.

replicaCount: 1

image:
  repository: registry.memchentic.ai/memchentic/memchentic
  # Empty → Chart.appVersion (pinned). Do not use latest in production.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: memchentic.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

# Non-secret application settings (ConfigMap → env).
config:
  # Must be the public https origin in real deployments.
  baseUrl: ""
  oauthProvider: internal
  oauthClientId: ""
  oauthIssuer: ""
  oauthAudience: ""
  oauthJwksUri: ""
  # Comma-separated. Blank = the provider preset's default scopes.
  oauthScopes: ""
  # Private-use redirect schemes native MCP clients may register (comma-separated).
  oauthNativeRedirectSchemes: cursor
  adminEmail: admin@example.com
  adminDisplayName: Admin
  postgresUser: memchentic
  postgresAppUser: memchentic_app
  postgresDb: memchentic
  postgresPort: 5432
  # Used when postgres.enabled=false (external database hostname).
  postgresHostname: ""
  # disable | prefer | require | verify-ca | verify-full. Use verify-full for any
  # database reached over a network you do not own (e.g. CNPG, managed Postgres).
  postgresSslmode: prefer
  # CA bundle path inside the pod; empty = system CAs.
  postgresSslrootcert: ""
  nearDupThreshold: "0.92"
  rrfK: "60"
  searchDefaultLimit: "20"
  browseDefaultLimit: "50"
  resultMaxLimit: "100"
  searchRecencyHalfLifeDays: "30"
  searchRecencyWeight: "0.25"
  searchPathBoost: "0.15"
  searchMinSimilarity: "0.2"
  nearDupCandidates: "5"
  overlapScanLimit: "2000"
  memoryUsageScoreWeight: "0.05"
  # Sliding TTL; "0" disables the default lifetime / the max ceiling.
  memoryDefaultTtlDays: "90"
  memoryTtlExtendDays: "90"
  memoryTtlTouchDebounceHours: "6"
  memoryMaxTtlDays: "730"
  corsOrigins: ""
  logLevel: INFO
  sessionRememberDays: "30"
  sessionBrowserHours: "12"
  # Default Secure cookies for non-loopback hosts.
  sessionCookieSecure: "true"
  # Addresses or CIDR ranges of the ingress controller / reverse proxy that
  # may set X-Forwarded-For and X-Forwarded-Proto (comma separated), e.g. the
  # pod CIDR of the ingress controller. Empty = trust only 127.0.0.1 (uvicorn
  # default), which makes every client share one rate-limit bucket.
  forwardedAllowIps: ""
  # Public self-registration when OAUTH_PROVIDER=internal. With an external
  # provider it gates first-time sign-in instead. A person in an IdP group that
  # an auth group is bound to is always admitted. When the Users auth group is
  # bound, nobody else is admitted and this value is ignored.
  # First-boot value only; afterwards System Settings is the source of truth.
  registerEnabled: "true"
  enableApiDocs: "false"

# Secret modes (exactly one):
#   existing        — use secrets.existingSecret (pre-synced by any tool) [preferred]
#   externalSecret  — chart renders ExternalSecret (Vault / AWS SM / 1Password via ESO)
#   inline          — chart renders a Secret from secrets.inline (dev only; no defaults)
secrets:
  mode: existing
  existingSecret: ""
  inline:
    ADMIN_PASSWORD: ""
    ADMIN_API_KEY: ""
    POSTGRES_PASSWORD: ""
    POSTGRES_APP_PASSWORD: ""
    # 32+ chars; encrypts signing keys stored in Postgres. Losing it invalidates them.
    ENCRYPTION_KEY: ""
    OAUTH_CLIENT_SECRET: ""
  externalSecret:
    refreshInterval: 1h
    secretStoreRef:
      name: ""
      kind: ClusterSecretStore
    # Each key → provider remoteRef. Property semantics depend on the backend.
    data:
      ADMIN_PASSWORD:
        key: ""
        property: ADMIN_PASSWORD
      ADMIN_API_KEY:
        key: ""
        property: ADMIN_API_KEY
      POSTGRES_PASSWORD:
        key: ""
        property: POSTGRES_PASSWORD
      POSTGRES_APP_PASSWORD:
        key: ""
        property: POSTGRES_APP_PASSWORD
      ENCRYPTION_KEY:
        key: ""
        property: ENCRYPTION_KEY
      OAUTH_CLIENT_SECRET:
        key: ""
        property: OAUTH_CLIENT_SECRET

postgres:
  enabled: true
  image:
    repository: pgvector/pgvector
    tag: pg16
    pullPolicy: IfNotPresent
  service:
    port: 5432
  persistence:
    enabled: true
    storageClass: ""
    size: 10Gi
  resources: {}
