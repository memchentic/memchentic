name: memchentic

# Production-shaped stack: images and named volumes only (no source bind mounts).
# Project name: memchentic (Compose `name:`).
# Services: application (FastAPI + FastMCP + React SPA) + postgres.
# Local bind mounts live in local.yaml (see COMPOSE_FILE in .env).

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: memchentic
      POSTGRES_PASSWORD: memchentic
      POSTGRES_DB: memchentic
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memchentic -d memchentic"]
      interval: 5s
      timeout: 5s
      retries: 10

  application:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${MEMCHENTIC_API_PORT:-18080}:8080"
    env_file: .env
    environment:
      # EMBEDDING_MODEL_PATH comes from image ENV / .env (baked MiniLM by default).
      DATABASE_URL: postgresql+asyncpg://memchentic:memchentic@postgres:5432/memchentic
    working_dir: /opt/memchentic
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
    # Keep the pre-rename volume so local data survives the service rename.
    name: memchentic_db-data
