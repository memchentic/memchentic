name: Publish App Image

# Manual production release of the single application image (FastAPI + FastMCP +
# GUI) to GHCR and/or Zot (registry.memchentic.ai) as a multi-arch manifest.
#
# Layout (Y-split, archentic-style):
#   plan → build_amd64 ┐
#        → build_arm64 ┴→ manifest
# Runner pool is a workflow_dispatch choice: self-hosted (homelab labels) or
# github (ubuntu-24.04 / ubuntu-24.04-arm). Per-arch refs (X.Y.Z-amd64 /
# X.Y.Z-arm64) exist only so the manifest job can stitch the published semver.
# Choose increment=Major|Minor|Patch to bump from the highest version among the
# existing GHCR tags (X.Y.Z, X.Y.Z-amd64, X.Y.Z-arm64). The plan job fails when
# it cannot list the tags or finds no version; tick first_release only for the
# very first publish (Major → 1.0.0, Minor → 0.1.0, Patch → 0.0.1). The manifest
# job refuses to overwrite an existing X.Y.Z tag and moves the floating
# ``latest`` tag onto the new semver image only when both architectures
# were built.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner pool
        required: true
        type: choice
        default: github
        options:
          - github
          - self-hosted
      platforms:
        description: Architectures to build
        required: true
        type: choice
        default: both
        options:
          - both
          - amd64
          - arm64
      increment:
        description: Which part of the semver to bump
        required: true
        type: choice
        default: Select
        options:
          - Select
          - Major
          - Minor
          - Patch
      registries:
        description: Which registries to publish the multi-arch release to
        required: true
        type: choice
        default: both
        options:
          - both
          - ghcr
          - zot
      first_release:
        description: Tick only for the very first publish (no released image exists yet)
        required: false
        type: boolean
        default: false

# Deny by default. Each job declares the scopes it uses.
permissions: {}

# One release at a time. A second dispatch waits for the running one, so two
# runs never plan the same version.
concurrency:
  group: publish-app-image
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Publish under the git repo owner so GITHUB_TOKEN links the package here.
  GHCR_NAMESPACE: ${{ github.repository_owner }}
  PACKAGE_NAME: memchentic

jobs:
  plan:
    name: Plan publish targets
    runs-on: ${{ fromJSON(github.event.inputs.runner == 'self-hosted' && '["self-hosted","linux","memchentic","build"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 5
    environment: release
    permissions:
      packages: read
    outputs:
      build_amd64: ${{ steps.plan.outputs.build_amd64 }}
      build_arm64: ${{ steps.plan.outputs.build_arm64 }}
      version: ${{ steps.plan.outputs.version }}
      selected_arches: ${{ steps.plan.outputs.selected_arches }}
    steps:
      - name: Require the default branch
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "${REF}" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "::error::Publish App Image runs only from the default branch (${DEFAULT_BRANCH}); this run uses ${REF}."
            exit 1
          fi

      - name: Plan version and arch legs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          SELECTED_RUNNER: ${{ github.event.inputs.runner }}
          SELECTED_PLATFORMS: ${{ github.event.inputs.platforms }}
          INCREMENT: ${{ github.event.inputs.increment }}
          PACKAGE: ${{ env.PACKAGE_NAME }}
          FIRST_RELEASE: ${{ github.event.inputs.first_release }}
        run: |
          set -euo pipefail

          want_amd64=false
          want_arm64=false
          case "${SELECTED_PLATFORMS}" in
            both)
              want_amd64=true
              want_arm64=true
              ;;
            amd64)
              want_amd64=true
              ;;
            arm64)
              want_arm64=true
              ;;
            *)
              echo "Unsupported platforms: ${SELECTED_PLATFORMS}" >&2
              exit 1
              ;;
          esac

          owner_path="users/${GHCR_NAMESPACE}"
          if [ "${OWNER_TYPE}" = "Organization" ]; then
            owner_path="orgs/${GHCR_NAMESPACE}"
          fi

          list_package_tags() {
            local package="$1"
            local page=1
            : > "${RUNNER_TEMP}/tags-${package}.txt"
            while :; do
              http_code="$(
                curl -sS -o "${RUNNER_TEMP}/package-versions.json" -w '%{http_code}' \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/${owner_path}/packages/container/${package}/versions?per_page=100&page=${page}"
              )"
              case "${http_code}" in
                200) ;;
                404)
                  if [ "${FIRST_RELEASE:-false}" = "true" ] && [ "${page}" -eq 1 ]; then
                    break
                  fi
                  echo "::error::GHCR package ${package} was not found (HTTP 404). Refusing to restart version numbering. Re-run with first_release ticked only if no image was ever published."
                  exit 1
                  ;;
                *)
                  echo "::error::Could not list GHCR tags for ${package} (HTTP ${http_code}). Refusing to plan a version."
                  exit 1
                  ;;
              esac
              jq -r '.[].metadata.container.tags[]? // empty' "${RUNNER_TEMP}/package-versions.json" \
                >> "${RUNNER_TEMP}/tags-${package}.txt"
              count="$(jq 'length' "${RUNNER_TEMP}/package-versions.json")"
              if [ "${count}" -lt 100 ]; then
                break
              fi
              page="$((page + 1))"
            done
          }

          bump_from_tags_file() {
            local tags_file="$1"
            local level="$2"
            local latest_semver
            latest_semver="$(
              grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+(-(amd64|arm64))?$' "${tags_file}" \
                | sed -E 's/^v//; s/-(amd64|arm64)$//' \
                | sort -u -t. -k1,1n -k2,2n -k3,3n \
                | tail -n 1 || true
            )"
            if [ -z "${latest_semver}" ]; then
              if [ "${FIRST_RELEASE:-false}" != "true" ]; then
                echo "::error::No released version tag was found for ${PACKAGE}. Refusing to restart version numbering. Re-run with first_release ticked only if no image was ever published." >&2
                exit 1
              fi
              case "${level}" in
                major) printf '%s\n' "1.0.0" ;;
                minor) printf '%s\n' "0.1.0" ;;
                patch) printf '%s\n' "0.0.1" ;;
                *)
                  echo "Unsupported increment: ${level}" >&2
                  exit 1
                  ;;
              esac
              return
            fi
            local major minor patch
            IFS='.' read -r major minor patch <<<"${latest_semver}"
            case "${level}" in
              major) printf '%s\n' "$((major + 1)).0.0" ;;
              minor) printf '%s\n' "${major}.$((minor + 1)).0" ;;
              patch) printf '%s\n' "${major}.${minor}.$((patch + 1))" ;;
              *)
                echo "Unsupported increment: ${level}" >&2
                exit 1
                ;;
            esac
          }

          increment="$(printf '%s' "${INCREMENT:-Select}" | tr '[:upper:]' '[:lower:]')"
          case "${increment}" in
            major|minor|patch) ;;
            *)
              echo "Choose Major, Minor, or Patch." >&2
              exit 1
              ;;
          esac
          list_package_tags "${PACKAGE}"
          version="$(bump_from_tags_file "${RUNNER_TEMP}/tags-${PACKAGE}.txt" "${increment}")"

          selected_arches=()
          build_amd64=false
          build_arm64=false
          if [ "${want_amd64}" = "true" ]; then
            selected_arches+=(amd64)
            build_amd64=true
          fi
          if [ "${want_arm64}" = "true" ]; then
            selected_arches+=(arm64)
            build_arm64=true
          fi
          selected_arches_csv="$(IFS=,; echo "${selected_arches[*]}")"

          {
            echo "build_amd64=${build_amd64}"
            echo "build_arm64=${build_arm64}"
            echo "version=${version}"
            echo "selected_arches=${selected_arches_csv}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Publish plan"
            echo "- Package: \`${PACKAGE}\`"
            echo "- Version: \`${version}\`"
            echo "- Runner: \`${SELECTED_RUNNER}\`"
            echo "- Platforms: \`${SELECTED_PLATFORMS}\` (arches: \`${selected_arches_csv}\`)"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Release gate (lint and tests in the image)
    needs: plan
    # Always GitHub-hosted: the gate never runs on the self-hosted pool.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build the dev image
        run: |
          set -euo pipefail
          docker build --file docker/Dockerfile --build-arg INSTALL_DEV=1 \
            --tag memchentic:release-gate .

      - name: Start Postgres
        run: |
          set -euo pipefail
          gate_db_password="$(openssl rand -hex 16)"
          echo "::add-mask::${gate_db_password}"
          echo "GATE_DB_PASSWORD=${gate_db_password}" >> "$GITHUB_ENV"
          docker network create release-gate
          docker run --detach --name release-gate-db --network release-gate \
            --env POSTGRES_USER=memchentic \
            --env POSTGRES_PASSWORD="${gate_db_password}" \
            --env POSTGRES_DB=memchentic \
            pgvector/pgvector:0.8.7-pg16
          for _ in $(seq 1 30); do
            if docker exec release-gate-db pg_isready -h 127.0.0.1 -U memchentic -d memchentic >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Postgres did not become ready"
          docker logs release-gate-db >&2
          exit 1

      - name: Lint (ruff)
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}/application/api/tests:/opt/memchentic/tests:ro" \
            memchentic:release-gate ruff check --no-cache src tests

      - name: Test (pytest)
        run: |
          docker run --rm --network release-gate \
            --env POSTGRES_HOSTNAME=release-gate-db \
            --env POSTGRES_PORT=5432 \
            --env POSTGRES_USER=memchentic \
            --env POSTGRES_PASSWORD="${GATE_DB_PASSWORD}" \
            --volume "${GITHUB_WORKSPACE}/application/api/tests:/opt/memchentic/tests:ro" \
            memchentic:release-gate pytest -q -p no:cacheprovider

  build_amd64:
    needs:
      - plan
      - test
    if: needs.plan.outputs.build_amd64 == 'true'
    runs-on: ${{ fromJSON(github.event.inputs.runner == 'self-hosted' && '["self-hosted","linux","memchentic","amd64","build"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-app-image-amd64
      cancel-in-progress: false
    env:
      ARCH: amd64
      PLATFORM: linux/amd64
      VERSION: ${{ needs.plan.outputs.version }}

    steps:
      # Self-hosted build nodes accumulate BuildKit cache; trim only there.
      # GitHub-hosted images already have enough free space. The step needs
      # Docker access only (no root), and it leaves unrelated images on the
      # host alone.
      - name: Free disk space
        if: github.event.inputs.runner == 'self-hosted'
        run: docker builder prune --all --force --filter until=168h || true

      - name: Isolate Docker CLI config
        run: |
          mkdir -p "${RUNNER_TEMP}/docker-config"
          echo "DOCKER_CONFIG=${RUNNER_TEMP}/docker-config" >> "$GITHUB_ENV"

      - name: Check out the code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Build and push native amd64 image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          chmod +x scripts/ci/publish_native_image.sh
          scripts/ci/publish_native_image.sh

  build_arm64:
    needs:
      - plan
      - test
    if: needs.plan.outputs.build_arm64 == 'true'
    runs-on: ${{ fromJSON(github.event.inputs.runner == 'self-hosted' && '["self-hosted","linux","memchentic","ARM64","build"]' || '["ubuntu-24.04-arm"]') }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-app-image-arm64
      cancel-in-progress: false
    env:
      ARCH: arm64
      PLATFORM: linux/arm64
      VERSION: ${{ needs.plan.outputs.version }}

    steps:
      # Self-hosted build nodes accumulate BuildKit cache; trim only there.
      # GitHub-hosted images already have enough free space. The step needs
      # Docker access only (no root), and it leaves unrelated images on the
      # host alone.
      - name: Free disk space
        if: github.event.inputs.runner == 'self-hosted'
        run: docker builder prune --all --force --filter until=168h || true

      - name: Isolate Docker CLI config
        run: |
          mkdir -p "${RUNNER_TEMP}/docker-config"
          echo "DOCKER_CONFIG=${RUNNER_TEMP}/docker-config" >> "$GITHUB_ENV"

      - name: Check out the code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Build and push native arm64 image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          chmod +x scripts/ci/publish_native_image.sh
          scripts/ci/publish_native_image.sh

  manifest:
    needs:
      - plan
      - build_amd64
      - build_arm64
    if: >
      always() &&
      needs.plan.result == 'success' &&
      (needs.plan.outputs.build_amd64 != 'true' || needs.build_amd64.result == 'success') &&
      (needs.plan.outputs.build_arm64 != 'true' || needs.build_arm64.result == 'success')
    runs-on: ${{ fromJSON(github.event.inputs.runner == 'self-hosted' && '["self-hosted","linux","memchentic","build"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 15
    permissions:
      packages: write
      id-token: write
    concurrency:
      group: publish-app-image-manifest
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SELECTED_ARCHES: ${{ needs.plan.outputs.selected_arches }}

    steps:
      - name: Isolate Docker CLI config
        run: |
          mkdir -p "${RUNNER_TEMP}/docker-config"
          echo "DOCKER_CONFIG=${RUNNER_TEMP}/docker-config" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Publish multi-arch to GHCR
        if: contains(fromJSON('["ghcr","both"]'), github.event.inputs.registries)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "${GH_TOKEN}" | docker login ghcr.io --username "${GH_ACTOR}" --password-stdin

          owner="$(printf '%s' "${GHCR_NAMESPACE}" | tr '[:upper:]' '[:lower:]')"
          image_base="${REGISTRY}/${owner}/${PACKAGE_NAME}"

          refs=()
          IFS=',' read -r -a arches <<<"${SELECTED_ARCHES}"
          for arch in "${arches[@]}"; do
            [ -n "${arch}" ] || continue
            refs+=("${image_base}:${VERSION}-${arch}")
          done

          if [ "${#refs[@]}" -eq 0 ]; then
            echo "No arch refs to stitch" >&2
            exit 1
          fi

          # Refuse to overwrite a released version. The check continues only
          # when the registry answers "not found" for the tag.
          if inspect_out="$(docker buildx imagetools inspect "${image_base}:${VERSION}" 2>&1)"; then
            echo "::error::${image_base}:${VERSION} already exists. Refusing to overwrite a released tag."
            exit 1
          elif ! printf '%s' "${inspect_out}" | grep -Eqi 'not found|manifest[ _]unknown|name[ _]unknown'; then
            echo "::error::Could not check whether ${image_base}:${VERSION} exists. Refusing to publish."
            printf '%s\n' "${inspect_out}" >&2
            exit 1
          fi

          tags=(--tag "${image_base}:${VERSION}")
          latest_note="not moved (single-architecture publish: ${SELECTED_ARCHES})"
          if [ "${SELECTED_ARCHES}" = "amd64,arm64" ]; then
            tags+=(--tag "${image_base}:latest")
            latest_note="moved to this release"
          fi

          echo "Stitching ${image_base}:${VERSION} from: ${refs[*]} (latest: ${latest_note})"
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"

          {
            echo "### Published (GHCR)"
            echo "- \`${image_base}:${VERSION}\`"
            echo "- \`${image_base}:latest\`: ${latest_note}"
            echo "- Arch refs: \`${refs[*]}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sign the GHCR image (keyless)
        if: contains(fromJSON('["ghcr","both"]'), github.event.inputs.registries)
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${GHCR_NAMESPACE}" | tr '[:upper:]' '[:lower:]')"
          image_base="${REGISTRY}/${owner}/${PACKAGE_NAME}"
          digest="$(docker buildx imagetools inspect "${image_base}:${VERSION}" --format '{{.Manifest.Digest}}')"
          case "${digest}" in
            sha256:*) ;;
            *)
              echo "::error::Could not resolve the digest of ${image_base}:${VERSION}"
              exit 1
              ;;
          esac
          cosign sign --yes "${image_base}@${digest}"

      - name: Publish multi-arch to Zot
        if: contains(fromJSON('["zot","both"]'), github.event.inputs.registries)
        env:
          ZOT_REGISTRY: registry.memchentic.ai
          ZOT_USERNAME: ${{ secrets.ZOT_USERNAME }}
          ZOT_PASSWORD: ${{ secrets.ZOT_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "${ZOT_PASSWORD}" | docker login "${ZOT_REGISTRY}" --username "${ZOT_USERNAME}" --password-stdin
          # Arch refs always land on GHCR during the build jobs; stitch them onto Zot.
          printf '%s' "${GH_TOKEN}" | docker login ghcr.io --username "${GH_ACTOR}" --password-stdin

          owner="$(printf '%s' "${GHCR_NAMESPACE}" | tr '[:upper:]' '[:lower:]')"
          source_base="${REGISTRY}/${owner}/${PACKAGE_NAME}"
          zot_base="${ZOT_REGISTRY}/${owner}/${PACKAGE_NAME}"

          refs=()
          IFS=',' read -r -a arches <<<"${SELECTED_ARCHES}"
          for arch in "${arches[@]}"; do
            [ -n "${arch}" ] || continue
            refs+=("${source_base}:${VERSION}-${arch}")
          done

          if [ "${#refs[@]}" -eq 0 ]; then
            echo "No arch refs to stitch" >&2
            exit 1
          fi

          # Refuse to overwrite a released version. The check continues only
          # when the registry answers "not found" for the tag.
          if inspect_out="$(docker buildx imagetools inspect "${zot_base}:${VERSION}" 2>&1)"; then
            echo "::error::${zot_base}:${VERSION} already exists. Refusing to overwrite a released tag."
            exit 1
          elif ! printf '%s' "${inspect_out}" | grep -Eqi 'not found|manifest[ _]unknown|name[ _]unknown'; then
            echo "::error::Could not check whether ${zot_base}:${VERSION} exists. Refusing to publish."
            printf '%s\n' "${inspect_out}" >&2
            exit 1
          fi

          tags=(--tag "${zot_base}:${VERSION}")
          latest_note="not moved (single-architecture publish: ${SELECTED_ARCHES})"
          if [ "${SELECTED_ARCHES}" = "amd64,arm64" ]; then
            tags+=(--tag "${zot_base}:latest")
            latest_note="moved to this release"
          fi

          echo "Stitching ${zot_base}:${VERSION} from: ${refs[*]} (latest: ${latest_note})"
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"

          {
            echo "### Published (Zot)"
            echo "- \`${zot_base}:${VERSION}\`"
            echo "- \`${zot_base}:latest\`: ${latest_note}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sign the Zot image (keyless)
        if: contains(fromJSON('["zot","both"]'), github.event.inputs.registries)
        env:
          ZOT_REGISTRY: registry.memchentic.ai
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${GHCR_NAMESPACE}" | tr '[:upper:]' '[:lower:]')"
          zot_base="${ZOT_REGISTRY}/${owner}/${PACKAGE_NAME}"
          digest="$(docker buildx imagetools inspect "${zot_base}:${VERSION}" --format '{{.Manifest.Digest}}')"
          case "${digest}" in
            sha256:*) ;;
            *)
              echo "::error::Could not resolve the digest of ${zot_base}:${VERSION}"
              exit 1
              ;;
          esac
          cosign sign --yes "${zot_base}@${digest}"
