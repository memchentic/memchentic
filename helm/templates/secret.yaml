{{- include "memchentic.validateSecrets" . }}
{{- if eq (include "memchentic.secretsMode" .) "inline" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "memchentic.fullname" . }}-env
  labels:
    {{- include "memchentic.labels" . | nindent 4 }}
type: Opaque
stringData:
  ADMIN_PASSWORD: {{ .Values.secrets.inline.ADMIN_PASSWORD | quote }}
  ADMIN_API_KEY: {{ .Values.secrets.inline.ADMIN_API_KEY | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.inline.POSTGRES_PASSWORD | quote }}
  POSTGRES_APP_PASSWORD: {{ .Values.secrets.inline.POSTGRES_APP_PASSWORD | quote }}
  ENCRYPTION_KEY: {{ .Values.secrets.inline.ENCRYPTION_KEY | quote }}
  OAUTH_CLIENT_SECRET: {{ .Values.secrets.inline.OAUTH_CLIENT_SECRET | default "" | quote }}
{{- end }}
