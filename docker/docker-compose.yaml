name: memchentic

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memchentic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memchentic}
      POSTGRES_DB: ${POSTGRES_DB:-memchentic}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  application:
    image: ${APPLICATION_IMAGE:-registry.memchentic.ai/memchentic/memchentic:latest}
    ports:
      - "${GUI_PORT:-18080}:8080"
      - "${API_PORT:-18081}:8080"
      - "${MCP_PORT:-18082}:8080"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
    name: memchentic_db-data
