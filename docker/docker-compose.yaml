name: memchentic

# Production-shaped stack: images and named volumes only (no source bind mounts).
# Project name: memchentic (Compose `name:`).
# Services: application (FastAPI + FastMCP + React SPA) + postgres.
# Local bind mounts live in local.yaml (see COMPOSE_FILE in .env).

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memchentic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memchentic}
      POSTGRES_DB: ${POSTGRES_DB:-memchentic}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  application:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      # One uvicorn serves GUI (/), API (/api), and MCP (/mcp). Separate host
      # ports are optional publishes of that same listener for reverse proxies.
      - "${GUI_PORT:-18080}:8080"
      - "${API_PORT:-18081}:8080"
      - "${MCP_PORT:-18082}:8080"
    env_file: .env
    # POSTGRES_* come from .env. MiniLM ONNX is baked into the image (no env switch).
    working_dir: /opt/memchentic
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
    # Keep the pre-rename volume so local data survives the service rename.
    name: memchentic_db-data
